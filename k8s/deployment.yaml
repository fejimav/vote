apiVersion: v1
kind: Namespace
metadata:
  name: vote
---

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: 817041139384.dkr.ecr.us-east-1.amazonaws.com/vote-image
        name: vote
        env:
            - name: REDIS_HOST
              value: redis
        ports:
            - containerPort: 80
              name: vote
